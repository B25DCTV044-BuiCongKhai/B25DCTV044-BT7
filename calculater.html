<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Calculator - React</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f6f8;
            font-family: Arial, sans-serif;
        }
        .calculator {
            width: 320px;
            background-color: white;
            border: 1px solid #ccc;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .display {
            background-color: #dcdcdc;
            height: 70px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 10px;
            font-size: 24px;
            margin-bottom: 10px;
            border: 1px solid #aaa;
            overflow: hidden;
            color: #333;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
        }
        .btn {
            border: 1px solid #333;
            padding: 15px 0;
            font-size: 16px;
            color: black;
            cursor: pointer;
        }
        .btn:active {
            opacity: 0.8;
        }
        .empty-space {
            background: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function Display({ value }) {
            return <div className="display">{value || "0"}</div>;
        }

        function Button({ label, color, onClick }) {
            return (
                <button
                    style={{ backgroundColor: color }}
                    className="btn"
                    onClick={() => onClick(label)}
                >
                    {label}
                </button>
            );
        }

        function App() {
            const [expression, setExpression] = useState("");

            const handleButtonClick = (value) => {
                if (value === "Clear") {
                    setExpression("");
                } else if (value === "Delete") {
                    setExpression(expression.slice(0, -1));
                } else if (value === "=") {
                    try {
                        setExpression(eval(expression).toString());
                    } catch (error) {
                        setExpression("Lỗi");
                    }
                } else {
                    setExpression(expression + value);
                }
            };

            const buttons = [
                { label: "Clear", color: "#4CAF50" },
                { label: "Delete", color: "#4CAF50" },
                { label: ".", color: "#4CAF50" },
                { label: "/", color: "#2196F3" }, 
                { label: "7", color: "#4CAF50" },
                { label: "8", color: "#4CAF50" },
                { label: "9", color: "#4CAF50" },
                { label: "*", color: "#4CAF50" },
                { label: "4", color: "#4CAF50" },
                { label: "5", color: "#4CAF50" },
                { label: "6", color: "#4CAF50" },
                { label: "-", color: "#4CAF50" },
                { label: "1", color: "#4CAF50" },
                { label: "2", color: "#4CAF50" },
                { label: "3", color: "#4CAF50" },
                { label: "+", color: "#4CAF50" },
            ];

            return (
                <div className="calculator">
                    <Display value={expression} />
                    <div className="keypad">
                        {buttons.map((btn, index) => (
                            <Button
                                key={index}
                                label={btn.label}
                                color={btn.color}
                                onClick={handleButtonClick}
                            />
                        ))}
                        <div className="empty-space"></div>
                        <Button label="0" color="#4CAF50" onClick={handleButtonClick} />
                        <Button label="=" color="#4CAF50" onClick={handleButtonClick} />
                        <div className="empty-space"></div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
