<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Bùi Công Khải - React</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-color: #f4f4f4;
            --container-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --border-color: #d1d1d1;
            --accent-color: #000000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .cv-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--container-bg);
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
        }

        header {
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 30px;
            margin-bottom: 40px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
        }

        header p {
            font-size: 16px;
            color: var(--text-muted);
            margin: 10px 0 0 0;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .section-container {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background-color: var(--border-color);
            margin-left: 20px;
        }

        .skills-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .skill-badge {
            background-color: transparent;
            color: var(--text-main);
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            border: 1px solid var(--text-main);
            transition: all 0.3s ease;
            cursor: default;
        }

        .skill-badge:hover {
            background-color: var(--accent-color);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .project-card {
            background-color: transparent;
            border-left: 2px solid var(--border-color);
            padding: 20px 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .project-card:hover {
            border-left-color: var(--accent-color);
            background-color: #f9f9f9;
        }

        .project-card h3 {
            margin: 0 0 10px 0;
            color: var(--accent-color);
            font-size: 20px;
            font-weight: 500;
        }

        .project-card p {
            margin: 0;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function Header({ name, studentId }) {
            return (
                <header>
                    <h1>{name}</h1>
                    <p>Mã sinh viên: {studentId} | Web Developer</p>
                </header>
            );
        }

        function Section({ title, children }) {
            return (
                <div className="section-container">
                    <h2 className="section-title">{title}</h2>
                    <div className="section-content">
                        {children}
                    </div>
                </div>
            );
        }

        function SkillList({ items }) {
            return (
                <div className="skills-grid">
                    {items.map((skill, index) => (
                        <span key={index} className="skill-badge">{skill}</span>
                    ))}
                </div>
            );
        }

        function ProjectList({ items }) {
            return (
                <div>
                    {items.map((project, index) => (
                        <div key={index} className="project-card">
                            <h3>{project.name}</h3>
                            <p>{project.description}</p>
                        </div>
                    ))}
                </div>
            );
        }

        function App() {
            const mySkills = [
                "Python", 
                "JavaScript", 
                "HTML & CSS", 
                "ReactJS", 
                "Flask", 
                "Web Speech API"
            ];

            const myProjects = [
                {
                    name: "Voice Helper",
                    description: "Ứng dụng web ghi chú thông minh với giao diện frontend tương tác, tích hợp Web Speech API."
                },
                {
                    name: "Family Web Chat",
                    description: "Ứng dụng nhắn tin thời gian thực với tính năng chia sẻ hình ảnh, xây dựng bằng Python Flask và WebSockets."
                },
                {
                    name: "Delivery Driver Navigation",
                    description: "Công cụ tìm kiếm tuyến đường giao hàng tối ưu dựa trên thuật toán Dijkstra."
                }
            ];

            return (
                <div className="cv-container">
                    <Header 
                        name="Bùi Công Khải" 
                        studentId="B25DCTV044" 
                    />

                    <Section title="Kỹ năng chuyên môn">
                        <SkillList items={mySkills} />
                    </Section>

                    <Section title="Dự án nổi bật">
                        <ProjectList items={myProjects} />
                    </Section>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
